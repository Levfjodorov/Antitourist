name: antitourist
publish_to: 'none'
version: 0.5.3+11

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  html: ^0.15.6
  http: ^1.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  url_launcher_platform_interface: 2.3.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/demo_places.json
    - assets/branding/logo_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/launcher_icon.png
  adaptive_icon_background: "#071426"
  adaptive_icon_foreground: assets/branding/logo_foreground.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 24
